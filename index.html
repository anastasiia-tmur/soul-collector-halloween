<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="description" content="Собиратель душ — хэллоуинская игра-змейка: собери души в правильном порядке и проведи их через ворота до рассвета.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
<title>Собиратель душ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=block&subset=cyrillic" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0714;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#f3e9d2}
  #pad{position:fixed;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;z-index:5;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #pad button{border:3px solid #3a2a16;border-radius:18px;background:rgba(224,210,170,.88);color:#3a2a16;font-size:26px;padding:0;line-height:1;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:system-ui}
  #pad button:active{background:rgba(160,140,90,.95)}
  #pad.skin button{border:0;border-radius:0;background:url('assets/btn.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;transition:transform .06s,filter .06s}
  #pad.skin button:active{background:url('assets/btn.png') center/100% 100% no-repeat;transform:scale(.92);filter:brightness(.82)}
  #pad button svg{width:46%;height:46%;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
  #vol{position:fixed;left:-100px;top:0;width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer;line-height:1;font-size:20px}
  #vol img{width:100%;height:100%;display:block;pointer-events:none;transition:filter .2s}
  #vol.off img{filter:grayscale(1) opacity(.45)}
  #vol .slash{display:none;position:absolute;left:6%;right:6%;top:50%;height:4px;margin-top:-2px;background:#b3261e;border-radius:2px;transform:rotate(-45deg);pointer-events:none}
  #vol.off .slash{display:block}
  @keyframes vol-shake{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-14deg) scale(1.1)}30%{transform:rotate(12deg) scale(1.1)}45%{transform:rotate(-10deg) scale(1.06)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
  #vol.shake{animation:vol-shake .6s ease-in-out}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- Настройки ----------
const W = 20, H = 20;                 // поле 20×20, замкнуто в кольцо, видно целиком
// телефон или планшет (сенсорный экран): на таких устройствах нет клавиатуры, поэтому показываем кнопки управления
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
let PAD_BTN = 64;                     // размер кнопки управления в пикселях (считается в resize)
let PAD_RESERVE = 0;                  // сколько места внизу оставляем под кнопки на вертикальном экране
let HUD = 140;                        // высота шапки в пикселях (считается в resize по размеру свитка)
const TYPES = ['bat', 'ghost', 'witch', 'owl'];
const EMOJI = { bat:'🦇', ghost:'👻', witch:'🧙', owl:'🦉', skeleton:'💀', pumpkin:'🎃' };
const COLOR = { bat:'#7b4bd6', ghost:'#8fd3ff', witch:'#4ec06b', owl:'#ff9a3c', skeleton:'#efe6cf', pumpkin:'#c24a00' };
const SEQ_LEN = 8;                    // душ на воротах
const START_DELAY = 5;                // секунд ожидания в начале: скелет стоит, пока игрок не нажмёт стрелку (или пока не пройдёт пауза)
const NIGHT = 120;                    // секунд до рассвета (2 минуты)
const STEP_MS = 480;                  // скорость скелета: шаг раз в 0.48 с (≈2.1 клетки/с)
const PUMPKINS = 10;
const WALL_SEGMENTS = 7;              // внутренние стены: сегменты по 3–5 клеток
const SPARE = 1;                      // запас блуждающих душ каждого типа
const GATE = { x0: 15, y0: 0, w: 5, h: 2 };   // большие ворота в правом верхнем углу (кольцо: заходить можно и с краёв)
const SPEED = { bat: 0.7, ghost: 0.45, witch: 0.25, owl: 0.1 };   // шанс шага за ход: летучие мыши быстрые, совы медленные
const SHAKE_S = 0.22;                 // сколько секунд скелет вздрагивает, когда нажата стрелка «назад»
const GRACE_S = 2;                    // секунд форы после тыквы: свеча рядом пока не убивает (скелет упирается в неё)
const PUMPKIN_RESPAWN = 0;            // 0 — съеденная тыква сразу появляется в случайном месте; N — через N шагов
const SHAPES = [                      // формы препятствий: как в классических змейках — столбы, блоки, рельсы, углы
  [[0,0],[0,1],[0,2],[1,2]],          // Г
  [[0,0],[1,0],[2,0],[1,1],[1,2]],    // Т
  [[1,0],[0,1],[1,1],[2,1],[1,2]],    // крест
  [[0,0],[1,0],[0,1],[1,1]],          // блок 2×2
  [[0,0],[0,1],[1,1],[2,1],[2,0]],    // скоба
  [[0,0],[1,0],[2,0],[3,0]],          // рельс
  [[0,0],[1,0],[2,0],[3,0],[4,0]],    // длинный рельс
  [[0,0],[1,1],[2,2]],                // диагональ
  [[0,0]],                            // столб
  [[0,0],[1,0]],                      // пара
];
const WALL_SHAPES = 13, WALL_MIN = 10;
// кладбищенские дорожки из плит: две аллеи через всё поле (кольцо) и подъезд к воротам.
// Чисто декоративные: ходить можно везде, но ограда на них не ставится — аллеи всегда свободны
const PATHS = new Set();
for (let x = 0; x < W; x++) PATHS.add(10 * W + x);
for (let y = 0; y < H; y++) PATHS.add(y * W + 10);
for (let y = 2; y <= 9; y++) PATHS.add(y * W + 17);

// ---------- Свитки ----------
// Подложки под тексты: положи PNG с прозрачным фоном в assets/ — scroll-rules, scroll-result, scroll-hint, scroll-hud.
// aspect = ширина/высота картинки, safe = безопасная зона для текста в долях картинки [x, y, ширина, высота].
// Пока файлов нет, рисуется пергамент-заглушка.
const SCROLL = {
  rules:  { aspect: 4 / 3, safe: [.15, .17, .70, .66] },
  result: { aspect: 2,     safe: [.15, .22, .70, .56] },
  hint:   { aspect: 6.7,   safe: [.10, .20, .80, .60] },
  hud:    { aspect: 7,     safe: [.06, .16, .88, .68] },
};
const INK = '#3a2a16', INK_TITLE = '#7a3b0c';
const HEAD_FONT = '"Rubik Wet Paint"';        // шрифт заголовков (Google Fonts, подгружается из интернета)

// ---------- Спрайты ----------
// Положи PNG в halloween-game/assets/ с именами bat, ghost, witch, owl, skeleton, pumpkin, gate, bone, wall —
// игра подхватит их сама. Пока файлов нет, рисуются плейсхолдеры.
const IMG = {};
// пока все картинки и шрифт заголовков не загрузились, игра ничего не показывает: иначе на долю секунды
// мелькают заглушки (пергамент, эмодзи), а потом подменяются настоящими картинками
let assetsReady = false;
{
  const pending = [...TYPES, 'skeleton', 'pumpkin', 'gate', 'volume', 'background'].map(k => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => res();                       // нет такого файла — это нормально, останется заглушка
    im.src = 'assets/' + k + '.png';
  }));
  const timeout = new Promise(res => setTimeout(res, 4000));      // не ждём дольше 4 секунд (например, нет интернета для шрифта)
  const font = document.fonts ? document.fonts.load('40px "Rubik Wet Paint"', 'Собиратель душ Души дома Рассвет Скелет обжёгся о свечу').catch(() => {}) : Promise.resolve();
  Promise.race([Promise.all([...pending, font]), timeout]).then(() => { assetsReady = true; });
}

// ---------- Утилиты ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw, ch, dpr, CS, ox, oy;
const mod = (a, n) => ((a % n) + n) % n;
const wd = (d, n) => mod(d + n / 2, n) - n / 2;     // кратчайшая дельта по кольцу
const rnd = n => Math.floor(Math.random() * n);
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return (h ^ (h >>> 16)) >>> 0;
}
// ширина шапки: на низком экране (телефон лёжа) шапка не должна съедать больше пятой части высоты
function hudWidth() { return Math.min(cw - 16, 920, ch * 0.2 * SCROLL.hud.aspect); }
function resize() {
  dpr = window.devicePixelRatio || 1;
  cw = innerWidth; ch = innerHeight;
  cv.width = cw * dpr; cv.height = ch * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  HUD = Math.round(8 + hudWidth() / SCROLL.hud.aspect + 10);
  PAD_BTN = Math.round(Math.max(52, Math.min(84, Math.min(cw, ch) * 0.17)));
  PAD_RESERVE = (IS_TOUCH && ch > cw) ? PAD_BTN * 3 + 36 : 0;           // вертикальный экран: кнопки под полем
  CS = Math.max(12, Math.floor(Math.min(cw / W, (ch - HUD - 10 - PAD_RESERVE) / H)));
  ox = Math.floor((cw - W * CS) / 2);
  oy = HUD + Math.floor((ch - HUD - PAD_RESERVE - H * CS) / 2);
}
addEventListener('resize', resize); resize();

// ---------- Состояние ----------
let S = null;

function inGate(x, y) { return x >= GATE.x0 && x < GATE.x0 + GATE.w && y >= GATE.y0 && y < GATE.y0 + GATE.h; }
function gateDist(x, y) {   // расстояние до ближайшей клетки ворот с учётом кольца
  let m = 99;
  for (let gy = GATE.y0; gy < GATE.y0 + GATE.h; gy++) for (let gx = GATE.x0; gx < GATE.x0 + GATE.w; gx++)
    m = Math.min(m, Math.max(Math.abs(wd(x - gx, W)), Math.abs(wd(y - gy, H))));
  return m;
}

function newGame() {
  let seq;
  do { seq = Array.from({ length: SEQ_LEN }, () => TYPES[rnd(TYPES.length)]); }
  while (!TYPES.every(t => seq.includes(t)));
  const reqCount = {};
  for (const t of TYPES) reqCount[t] = seq.filter(x => x === t).length;
  S = {
    state: 'start', seq, reqCount,
    head: { x: 5, y: 14 }, dir: { x: 0, y: -1 }, queue: [],
    tail: [], path: [], souls: [], pumpkins: [], respawn: [],
    moving: false, idle: 0, introT: 0, graceT: 0, shakeT: 0, t: NIGHT, acc: 0, msg: '', msgT: 0, flash: 0, elapsed: 0
  };
  S.walls = makeWalls(S.head);
  for (let i = 0; i < PUMPKINS; i++) spawnPumpkin();
  replenish();
}

function isWall(x, y) { return S.walls.has(y * W + x); }

// стены: фигуры (Г, Т, крест, блок, скоба, рельсы, столбы) со случайным поворотом.
// Фигуры не касаются друг друга (между ними остаётся проход), не подходят к воротам и старту,
// а всё поле остаётся связным с учётом кольца — застрять негде.
function makeWalls(start) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const cells = new Set(), owner = new Map();
    let placedCount = 0;
    for (let k = 0; k < WALL_SHAPES; k++) {
      for (let n = 0; n < 80; n++) {
        let sh = SHAPES[rnd(SHAPES.length)];
        for (let r = rnd(4); r > 0; r--) sh = sh.map(([x, y]) => [-y, x]);
        if (Math.random() < 0.5) sh = sh.map(([x, y]) => [-x, y]);
        const x0 = rnd(W), y0 = rnd(H);
        const seg = sh.map(([x, y]) => ({ x: mod(x0 + x, W), y: mod(y0 + y, H) }));
        const good = seg.every(c => {
          if (gateDist(c.x, c.y) <= 2 || PATHS.has(c.y * W + c.x)) return false;
          if (c.x === 0 || c.y === 0 || c.x === W - 1 || c.y === H - 1) return false;   // у края поля свечей нет: переход через край всегда безопасен
          if (Math.abs(wd(c.x - start.x, W)) <= 2 && Math.abs(wd(c.y - start.y, H)) <= 2) return false;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const o = owner.get(mod(c.y + dy, H) * W + mod(c.x + dx, W));
            if (o !== undefined && o !== k) return false;
          }
          return true;
        });
        if (good) { for (const c of seg) { cells.add(c.y * W + c.x); owner.set(c.y * W + c.x, k); } placedCount++; break; }
      }
    }
    if (placedCount < WALL_MIN) continue;
    const blocked = i => cells.has(i) || inGate(i % W, Math.floor(i / W));
    const seen = new Set([start.y * W + start.x]), stack = [start.y * W + start.x];
    while (stack.length) {
      const i = stack.pop(), x = i % W, y = Math.floor(i / W);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const j = mod(y + dy, H) * W + mod(x + dx, W);
        if (!seen.has(j) && !blocked(j)) { seen.add(j); stack.push(j); }
      }
    }
    if (seen.size === W * H - cells.size - GATE.w * GATE.h) return cells;
  }
  return new Set();
}

function free(x, y) {
  if (isWall(x, y)) return false;
  if (S.head.x === x && S.head.y === y) return false;
  if (inGate(x, y)) return false;
  for (const p of S.path) if (p.x === x && p.y === y) return false;
  for (const s of S.souls) if (s.x === x && s.y === y) return false;
  for (const p of S.pumpkins) if (p.x === x && p.y === y) return false;
  return true;
}
function randomFreeCell() {
  for (let n = 0; n < 500; n++) {
    const x = rnd(W), y = rnd(H);
    const dh = Math.hypot(wd(x - S.head.x, W), wd(y - S.head.y, H));
    if (dh >= 3 && gateDist(x, y) >= 2 && free(x, y)) return { x, y };
  }
  return null;
}
function spawnSoul(type) { const c = randomFreeCell(); if (c) S.souls.push({ ...c, type }); }
function spawnPumpkin() { const c = randomFreeCell(); if (c) S.pumpkins.push(c); }

// длина верно выстроенного начала хвоста
function prefixLen() {
  let i = 0;
  while (i < S.tail.length && i < S.seq.length && S.tail[i] === S.seq[i]) i++;
  return i;
}
// инвариант против тупика: блуждающих душ каждого типа всегда хватает, чтобы выстроить порядок заново
function replenish() {
  const have = {}, ok = {};
  for (const t of TYPES) { have[t] = 0; ok[t] = 0; }
  for (const s of S.souls) have[s.type]++;
  const pl = prefixLen();
  for (let i = 0; i < pl; i++) ok[S.tail[i]]++;
  for (const t of TYPES) {
    const need = S.reqCount[t] - ok[t] + SPARE;
    while (have[t] < need) { spawnSoul(t); have[t]++; }
  }
}

function say(text, sec = 2) { S.msg = text; S.msgT = sec; }

// ---------- Ход ----------
function trimPath() { while (S.path.length > S.tail.length) S.path.pop(); }

function step() {
  const q = S.queue.shift();
  if (q) S.dir = q;
  const nx = mod(S.head.x + S.dir.x, W), ny = mod(S.head.y + S.dir.y, H);

  // ворота
  if (inGate(nx, ny)) {
    if (S.tail.length === SEQ_LEN && S.tail.every((t, i) => t === S.seq[i])) {
      S.state = 'win';
    } else if (S.tail.length !== SEQ_LEN) {
      say('Ворота закрыты: нужно ровно ' + SEQ_LEN + ' душ в хвосте (сейчас ' + S.tail.length + ')');
    } else {
      say('Порядок не тот — ворота не открываются');
    }
    tickWorld();
    return;
  }

  // стена: не убивает, просто не пускает
  if (isWall(nx, ny) && S.graceT > 0) { tickWorld(); return; }   // фора после тыквы: свеча не убивает, скелет просто стоит
  if (isWall(nx, ny)) {                    // задел свечу — конец игры
    S.head.x = nx; S.head.y = ny;          // скелет «влетает» в свечу, чтобы было видно, что случилось
    S.state = 'lose'; S.loseReason = 'candle'; S.flash = 0.6;
    return;
  }

  // удар о собственный хвост: после хода заняты старая голова и path[0..len-2]
  const hit = S.path.slice(0, Math.max(0, S.tail.length - 1)).some(p => p.x === nx && p.y === ny);
  const old = { x: S.head.x, y: S.head.y };
  S.head.x = nx; S.head.y = ny;
  if (hit) {
    S.tail = []; S.path = [];
    S.flash = 0.45;
    say('Хвост порван — души разбежались!', 2.5);
    replenish();
    return;
  }

  S.path.unshift(old);

  // блуждающая душа
  const si = S.souls.findIndex(s => s.x === nx && s.y === ny);
  if (si >= 0) {
    const s = S.souls.splice(si, 1)[0];
    S.tail.push(s.type);                 // путь не обрезаем — хвост растёт
  } else {
    trimPath();
  }

  // тыква
  const pi = S.pumpkins.findIndex(p => p.x === nx && p.y === ny);
  if (pi >= 0) {
    S.pumpkins.splice(pi, 1);
    S.graceT = GRACE_S;                    // тыква отбросила скелета — даём время уйти от свечи
    if (PUMPKIN_RESPAWN > 0) S.respawn.push(PUMPKIN_RESPAWN); else spawnPumpkin();
    if (S.tail.length) { S.tail.pop(); trimPath(); say('Тыква забрала последнюю душу'); }
  }

  tickWorld();
}

// мир живёт, даже когда скелет упёрся в стену или ворота
function tickWorld() {
  // блуждание душ
  for (const s of S.souls) {
    if (Math.random() < SPEED[s.type]) {
      const d = [[1,0],[-1,0],[0,1],[0,-1]][rnd(4)];
      const x = mod(s.x + d[0], W), y = mod(s.y + d[1], H);
      if (free(x, y)) { s.x = x; s.y = y; }
    }
  }
  // тыквы тоже бродят (чуть реже душ)
  for (const p of S.pumpkins) {
    if (Math.random() < 0.25) {
      const d = [[1,0],[-1,0],[0,1],[0,-1]][rnd(4)];
      const x = mod(p.x + d[0], W), y = mod(p.y + d[1], H);
      if (free(x, y)) { p.x = x; p.y = y; }
    }
  }
  for (let i = S.respawn.length - 1; i >= 0; i--) {
    if (--S.respawn[i] <= 0) { spawnPumpkin(); S.respawn.splice(i, 1); }
  }
  replenish();
}

// ---------- Музыка ----------
// Если положить assets/music.mp3 — играет он (по кругу). Иначе звучит тихая мрачная мелодия, которую игра
// сама синтезирует (WebAudio): низкий гул, редкие колокольчики в минорной гамме. Включается с первым нажатием.
// Выключить/включить: кнопка в правом нижнем углу или клавиша M.
const Music = (() => {
  let ac = null, master = null, bus = null, el = null, started = false, on = true, next = 0, beat = 0, last = -1;
  const SCALE = [220, 261.63, 329.63, 415.3, 440, 523.25, 659.25, 880];   // ля минор (гармонический)
  function note(t, f, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function synth() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = on ? 0.55 : 0; master.connect(ac.destination);
    bus = ac.createGain(); bus.gain.value = 1; bus.connect(master);
    const dl = ac.createDelay(); dl.delayTime.value = 0.42;                // эхо, как в склепе
    const fb = ac.createGain(); fb.gain.value = 0.42;
    bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);

  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// текст сам подбирает размер шрифта, чтобы поместиться в безопасную зону свитка
function drawText(items, area, maxFs) {
  let L = null;
  for (let fs = maxFs; fs >= 9; fs--) {
    let total = 0; const out = [];
    for (const it of items) {
      let f = fs * (it.k || 1);
      if (it.parts) {                                   // строка с картинкой-значком внутри текста
        ctx.font = '500 ' + f + 'px system-ui';
        const wsum = it.parts.reduce((t, q) => t + (q.icon ? f * 1.5 : ctx.measureText(q.text).width), 0);
        if (wsum > area.w) f *= area.w / wsum;
        out.push({ ...it, f, ls: [] }); total += f * 1.6 + fs * (it.gap ?? .45);
        continue;
      }
      ctx.font = (it.font ? '400 ' : it.bold ? '700 ' : '500 ') + f + 'px ' + (it.font ? it.font + ', system-ui' : 'system-ui');
      const ls = wrapLines(it.text, area.w);
      out.push({ ...it, f, ls }); total += ls.length * f * 1.28 + fs * (it.gap ?? .45);
    }
    total -= fs * (items[items.length - 1].gap ?? .45);
    L = { out, total, fs };
    if (total <= area.h) break;
  }
  let y = area.y + (area.h - L.total) / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const it of L.out) {
    if (it.parts) {
      const f = it.f; ctx.font = '500 ' + f + 'px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = it.color || INK;
      const wd2 = it.parts.reduce((t, q) => t + (q.icon ? f * 1.5 : ctx.measureText(q.text).width), 0);
      let x = area.x + (area.w - wd2) / 2;
      for (const q of it.parts) {
        if (q.icon) {
          const im = IMG[q.icon];
          if (im) ctx.drawImage(im, x, y + f * 0.05, f * 1.5, f * 1.5); else ctx.fillText('🔊', x, y + f * 0.2);
          x += f * 1.5;
        } else { ctx.fillText(q.text, x, y + f * 0.2); x += ctx.measureText(q.text).width; }
      }
      ctx.textAlign = 'center'; y += f * 1.6 + L.fs * (it.gap ?? .45);
      continue;
    }
    ctx.font = (it.font ? '400 ' : it.bold ? '700 ' : '500 ') + it.f + 'px ' + (it.font ? it.font + ', system-ui' : 'system-ui'); ctx.fillStyle = it.color || INK;
    for (const l of it.ls) { ctx.fillText(l, area.x + area.w / 2, y); y += it.f * 1.28; }
    y += L.fs * (it.gap ?? .45);
  }
}
function drawHUD() {
  const p = 1 - S.t / NIGHT;
  const g = ctx.createLinearGradient(0, 0, cw, 0);               // полоска рассвета
  g.addColorStop(0, '#2a1d4d'); g.addColorStop(1, '#ff9a5c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cw * Math.max(0, Math.min(1, p)), 5);
  const a = scroll('hud', cw / 2, 8, hudWidth());
  if (a.w < 60 || a.h < 20) return;
  // крупный таймер слева
  const left = Math.max(0, Math.ceil(S.t)), tw = a.w * 0.34;
  // кнопка музыки рядом с таймером: вдвое крупнее прежней, но так, чтобы таймер оставался крупным (на узких экранах кнопка меньше)
  const tfMax = Math.min(a.h * 0.85, tw / 2.5);
  const bs = Math.max(24, Math.min(2 * Math.max(20, Math.min(38, a.h * 0.5)), (tw - 1.5 * tfMax) / 1.3, a.h * 1.1)), bgap = bs * 0.3;
  const tf = Math.min(a.h * 0.85, (tw - bs - bgap) / 2.5);
  const label = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  ctx.font = '800 ' + tf + 'px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const tW = ctx.measureText(label).width, startX = a.x + (tw - (tW + bgap + bs)) / 2;
  ctx.fillStyle = left <= 20 ? '#b3261e' : INK;
  ctx.fillText(label, startX, a.y + a.h * 0.5);
  Music.place(startX + tW + bgap + bs / 2, a.y + a.h * 0.5, bs);
  // цепочка, которую надо собрать, рядом с таймером
  const cx0 = a.x + tw + a.w * 0.03, cwid = a.w - tw - a.w * 0.03, rowH = a.h * 0.74;
  const size = Math.min(rowH, cwid / (SEQ_LEN * 1.16)), gap = size * 0.16;
  const total = SEQ_LEN * size + (SEQ_LEN - 1) * gap, x0 = cx0 + (cwid - total) / 2;
  const pl = prefixLen();
  for (let i = 0; i < SEQ_LEN; i++) {
    const x = x0 + i * (size + gap) + size / 2, y = a.y + rowH / 2;
    sprite(S.seq[i], x, y, size * 0.9);
    ctx.lineWidth = Math.max(2, size * 0.07);
    if (i < pl) ctx.strokeStyle = '#2e9e4a';
    else if (i === pl && i < S.tail.length) ctx.strokeStyle = '#c0392b';
    else ctx.strokeStyle = 'rgba(58,42,22,.35)';
    ctx.beginPath(); ctx.arc(x, y, size * 0.5, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = INK; ctx.globalAlpha = 0.75; ctx.font = '500 ' + Math.max(9, a.h * 0.17) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Собери души в правильном порядке', cx0 + cwid / 2, a.y + a.h * 0.92);
  ctx.globalAlpha = 1;
}
function overlay(kind, items) {
  ctx.fillStyle = 'rgba(8,4,16,.72)'; ctx.fillRect(0, 0, cw, ch);
  const sp = SCROLL[kind];
  const w = Math.min(cw * 0.94, ch * 0.94 * sp.aspect, kind === 'rules' ? 900 : 760);
  const h = w / sp.aspect;
  if (w < 60) return;
  const a = scroll(kind, cw / 2, (ch - h) / 2, w);
  drawText(items, a, Math.max(12, Math.min(25, w * 0.034)));
}
function render() {
  if (!assetsReady) { ctx.fillStyle = '#0b0714'; ctx.fillRect(0, 0, cw, ch); Music.show(false); return; }
  ctx.fillStyle = '#0b0714'; ctx.fillRect(0, 0, cw, ch);
  drawGround(); drawGate(); drawEntities();
  const p = Math.max(0, Math.min(1, 1 - S.t / NIGHT));      // рассвет: тёплая дымка растёт
  ctx.fillStyle = 'rgba(255,140,90,' + (p * 0.32) + ')'; ctx.fillRect(0, 0, cw, ch);
  if (S.flash > 0) { ctx.fillStyle = 'rgba(255,40,40,' + S.flash + ')'; ctx.fillRect(0, 0, cw, ch); }
  drawHUD();
  Music.show(S.state === 'play');
  Pad.show(S.state === 'play');                       // поверх экранов старта и конца игры кнопка не нужна
  if (S.msgT > 0) {
    const w = Math.min(cw * 0.92, 620), h = w / SCROLL.hint.aspect;
    if (w < 60) return;
    const a = scroll('hint', cw / 2, ch - h - 10, w);
    drawText([{ text: S.msg, bold: true }], a, Math.max(11, Math.min(20, h * 0.25)));
  }
  if (S.state === 'start') overlay('rules', [
    { text: 'Собиратель душ', font: HEAD_FONT, k: 1.9, color: INK_TITLE, gap: 1.0 },
    { text: 'Собери души, которые летают по кладбищу в порядке, который показан над полем игры, и проведи их через ворота', gap: 1.1 },
    { text: '🎃 — тыква забирает последнюю душу из собранной цепочки', gap: .5 },
    { text: '🕯️ — касание свечи заканчивает игру', gap: 1.1 },
    { parts: [{ text: 'Чтобы выключить музыку, нажми ' }, { icon: 'volume' }, { text: ' рядом с таймером' }], gap: 1.1 },
    { text: IS_TOUCH ? 'Чтобы начать, коснись экрана' : 'Чтобы начать, нажми пробел', k: .8, gap: 0 }
  ]);
  if (S.state === 'win') overlay('result', [
    { text: 'Души дома! 🪦', font: HEAD_FONT, k: 1.9, color: INK_TITLE, gap: .7 },
    { text: 'Ты успел за ' + fmt(NIGHT - S.t) + ' из ' + fmt(NIGHT) + '.' },
    { text: (IS_TOUCH ? 'Чтобы сыграть ещё раз, коснись экрана' : 'Чтобы сыграть ещё раз, кликни по экрану'), k: .8, gap: 0 }
  ]);
  if (S.state === 'lose') {
    const candle = S.loseReason === 'candle';
    overlay('result', [
      { text: candle ? 'Скелет обжёгся о свечу 🔥' : 'Рассвет… ☀️', font: HEAD_FONT, k: 1.8, color: INK_TITLE, gap: .7 },
      { text: candle ? 'Души разбежались.' : 'Души не успели вернуться.' },
      { text: (IS_TOUCH ? 'Чтобы сыграть ещё раз, коснись экрана' : 'Чтобы сыграть ещё раз, кликни по экрану'), k: .8, gap: 0 }
    ]);
  }
}
function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.state === 'play') { S.introT += dt; if (S.graceT > 0) S.graceT = Math.max(0, S.graceT - dt); if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt); }
  if (S.state === 'play' && !S.moving) {   // в начале скелет стоит: ждём стрелку или START_DELAY секунд
    S.idle += dt;
    if (S.idle >= START_DELAY) S.moving = true;
  }
  if (S.state === 'play' && S.moving) {
    S.t -= dt; S.acc += dt * 1000;
    while (S.acc >= STEP_MS && S.state === 'play') { S.acc -= STEP_MS; step(); }
    if (S.t <= 0 && S.state === 'play') { S.t = 0; S.state = 'lose'; }
  }
  if (S.msgT > 0) S.msgT -= dt;
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
  render();
}
newGame();
window.game = { get S() { return S; }, step, pushDir, newGame, startOrRestart };
requestAnimationFrame(frame);
</script>
